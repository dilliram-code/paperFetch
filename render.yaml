services:
  - type: web
    name: paperfetch
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: UNPAYWALL_EMAIL
        value: researcher@paperfetch.app
      - key: CROSSREF_MAILTO
        value: researcher@paperfetch.app
      - key: MAX_BATCH_SIZE
        value: 10
      - key: MAX_CONCURRENT_DOWNLOADS
        value: 10
      - key: CHUNK_SIZE_BYTES
        value: 262144
      - key: MAX_STORAGE_MB
        value: 500
      - key: AUTO_FLUSH_INTERVAL_MINUTES
        value: 30
      - key: STORAGE_RETENTION_HOURS
        value: 24
      - key: AUTO_CLEANUP_ENABLED
        value: true


